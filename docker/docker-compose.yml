services:
  broker:
    image: apache/kafka:4.3.1
    hostname: broker
    container_name: kafka-tui-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "Ug8hX1LbQdeU90q3scS_dw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.11
    hostname: schema-registry
    container_name: kafka-tui-schema-registry
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://broker:19092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  producer:
    build: ./producer
    container_name: kafka-tui-producer
    depends_on:
      broker:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "broker:19092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      # Silences a cosmetic kafkajs warning about its v2.0.0 default-partitioner
      # change; irrelevant here since nothing depends on key->partition stability.
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
      RATE_MSGS_PER_SEC: "${RATE_MSGS_PER_SEC:-5}"
      BURST_ENABLED: "${BURST_ENABLED:-true}"
      BURST_RATE_MSGS_PER_SEC: "${BURST_RATE_MSGS_PER_SEC:-200}"
      BURST_INTERVAL_MS: "${BURST_INTERVAL_MS:-60000}"
      BURST_DURATION_MS: "${BURST_DURATION_MS:-5000}"
    restart: unless-stopped
